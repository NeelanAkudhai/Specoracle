# SpecOracle System Configuration
# Benchmark Scope
n_problems: 60
seed: 42
n_cases: 10
min_trusted: 4
max_rounds: 2

# LLM Inference Settings
temperature: 0.0
max_tokens: 4096
rpm: 25
base_url: "https://api.groq.com/openai/v1"

# Cross-Model Consensus Architectures (Recommended for Groq)
# Writer and Reference utilize distinct model families to decouple reasoning errors
models:
  writer: "openai/gpt-oss-120b"                         # Test Writer Agent (GPT-OSS family)
  reference: "qwen/qwen3.8-27b"                         # Reference Implementer (Qwen family)
  same: "openai/gpt-oss-120b"                           # Ablation baseline

# Sandbox Execution & Isolation (Windows and POSIX safe)
sandbox:
  run_timeout_s: 15
  case_timeout_s: 5
  memory_mb: 512
  python: ""

# File System Directories & Paths
paths:
  data_dir: "data"
  cache_db: "cache/llm_cache.sqlite"
  results_dir: "results"
  problems_file: "data/problems.jsonl"
  manifest_file: "data/sample_manifest.json"
  raw_results_dir: "results/raw"
  tables_dir: "results/tables"
  figures_dir: "results/figures"
  error_analysis: "results/error_analysis.md"
